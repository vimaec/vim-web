name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vim-html-ds is a git submodule and the build compiles it.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # The build is the type gate: there is no separate tsc step, and the declaration
      # bundles catch what the app build does not.
      - name: Build
        run: npm run build
